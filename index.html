<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- PWA Manifest & Theme -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#181818">
    <link rel="apple-touch-icon" href="icon.png"> <!-- Optional iOS icon -->

    <title>Python Mobile IDE Max</title>
    
    <!-- Pro Coding Font -->
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.32.2/ace.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.32.2/ext-language_tools.min.js"></script>
    <script src="https://cdn.jsdelivr.net/pyodide/v0.24.1/full/pyodide.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

    <style>
        /* (Keep your exact CSS from the previous Max version here to save space) */
        :root { --bg-base: #181818; --bg-editor: #1e1e1e; --bg-header: #2b2d31; --tab-bg: #1e1f22; --tab-active: #1e1e1e; --text-main: #cccccc; --text-bright: #ffffff; --accent: #3794ff; --accent-hover: #1e7be6; --secondary: #238636; --secondary-hover: #2ea043; --danger: #f85149; --terminal-bg: #0d1117; --terminal-text: #7ee787; --border-color: #3e4045; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg-base); color: var(--text-main); display: flex; flex-direction: column; height: 100vh; height: 100dvh; overflow: hidden; }
        header { background-color: var(--bg-header); padding: 8px 12px; display: flex; justify-content: space-between; align-items: center; overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid var(--border-color); gap: 12px; }
        header::-webkit-scrollbar { display: none; }
        .toolbar-group { display: flex; gap: 8px; align-items: center; }
        button { color: var(--text-bright); background-color: #3c3f44; border: 1px solid rgba(255,255,255,0.1); padding: 8px 14px; border-radius: 6px; font-size: 0.9rem; font-weight: 600; cursor: pointer; white-space: nowrap; display: flex; align-items: center; gap: 6px; transition: all 0.2s ease; }
        button:hover { background-color: #4b4e54; }
        button:active { transform: scale(0.95); }
        button:disabled { background-color: #333; color: #777; cursor: not-allowed; border-color: transparent; }
        .run-btn { background-color: var(--accent); border-color: transparent; } .run-btn:hover { background-color: var(--accent-hover); }
        .scan-btn { background-color: var(--secondary); border-color: transparent; } .scan-btn:hover { background-color: var(--secondary-hover); }
        .icon-btn { padding: 8px; font-size: 1.2rem; background: transparent; border-color: transparent; color: var(--text-main); } .icon-btn:hover { background-color: rgba(255,255,255,0.1); color: var(--text-bright); }
        #tab-bar { display: flex; background-color: var(--tab-bg); overflow-x: auto; white-space: nowrap; scrollbar-width: none; }
        .tab { padding: 10px 16px; color: #8b949e; cursor: pointer; display: flex; align-items: center; gap: 8px; font-size: 0.85rem; border-right: 1px solid var(--border-color); border-top: 2px solid transparent; transition: background 0.2s; }
        .tab:hover { background-color: rgba(255,255,255,0.05); color: var(--text-bright); }
        .tab.active { background-color: var(--tab-active); color: var(--text-bright); border-top: 2px solid var(--accent); }
        .close-tab { font-size: 1.1rem; display: flex; align-items: center; justify-content: center; width: 20px; height: 20px; border-radius: 4px; } .close-tab:hover { background-color: rgba(255,85,85,0.2); color: var(--danger); }
        #add-tab-btn { background: none; color: #8b949e; padding: 10px 16px; border: none; border-radius: 0; border-right: 1px solid var(--border-color); } #add-tab-btn:hover { color: var(--text-bright); background-color: rgba(255,255,255,0.05); }
        .workspace { display: flex; flex-direction: column; flex: 1; }
        #editor-container { flex: 1; width: 100%; border-bottom: 2px solid #000; }
        .terminal-wrapper { flex: 0.6; display: flex; flex-direction: column; background-color: var(--terminal-bg); }
        .terminal-header { background: #010409; color: #8b949e; padding: 6px 14px; font-size: 0.75rem; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #21262d; }
        .clear-btn { background: none; color: #8b949e; padding: 4px 8px; font-size: 0.75rem; border: none; } .clear-btn:hover { color: var(--text-bright); }
        #console { flex: 1; padding: 12px; overflow-y: auto; font-family: 'JetBrains Mono', monospace; font-size: 13px; line-height: 1.5; color: var(--terminal-text); white-space: pre-wrap; word-wrap: break-word; }
        .error-text { color: var(--danger); } .sys-text { color: #8b949e; } .scan-text { color: #d2a8ff; } .hint-text { color: #58a6ff; font-weight: bold; }
    </style>
</head>
<body>

    <header>
        <!-- (Keep your exact header HTML from the Max version here) -->
        <div class="toolbar-group">
            <button class="icon-btn" onclick="editor.undo()" title="Undo"><i class="ph ph-arrow-u-up-left"></i></button>
            <button class="icon-btn" onclick="editor.redo()" title="Redo"><i class="ph ph-arrow-u-up-right"></i></button>
            <div style="width: 1px; height: 20px; background: var(--border-color); margin: 0 4px;"></div>
            <button class="icon-btn" onclick="uploadFile()" title="Open File"><i class="ph ph-folder-open"></i></button>
            <button class="icon-btn" onclick="downloadCurrentFile()" title="Save to Device"><i class="ph ph-floppy-disk"></i></button>
            <input type="file" id="file-upload" accept=".py,.txt" style="display: none;">
        </div>
        <div class="toolbar-group">
            <input type="file" id="camera-input" accept="image/*" capture="environment" style="display: none;">
            <button id="scan-btn" class="scan-btn"><i class="ph ph-camera"></i> Scan</button>
            <button id="run-btn" class="run-btn" disabled><i class="ph ph-spinner-gap ph-spin"></i> Loading</button>
        </div>
    </header>

    <div id="tab-bar">
        <button id="add-tab-btn" onclick="promptNewFile()"><i class="ph ph-plus"></i></button>
    </div>

    <div class="workspace">
        <div id="editor-container"></div>
        <div class="terminal-wrapper">
            <div class="terminal-header">
                <span style="display: flex; align-items: center; gap: 6px;"><i class="ph ph-terminal"></i> Terminal</span>
                <button class="clear-btn" onclick="clearConsole()"><i class="ph ph-trash"></i> Clear</button>
            </div>
            <div id="console"><span class="sys-text">[System] Initializing Python core...</span>\n</div>
        </div>
    </div>

    <script>
        // ==========================================
        // NEW: REGISTER SERVICE WORKER FOR PWA
        // ==========================================
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(registration => {
                        console.log('[PWA] Service Worker registered:', registration);
                    })
                    .catch(error => {
                        console.error('[PWA] Service Worker registration failed:', error);
                    });
            });
        }

        // ==========================================
        // KEEP YOUR EXACT JAVASCRIPT FROM MAX HERE
        // ==========================================
        
        // --- 1. EDITOR & STORAGE SYSTEM ---
        ace.require("ace/ext/language_tools");
        const editor = ace.edit("editor-container");
        editor.setTheme("ace/theme/tomorrow_night_eighties");
        editor.setOptions({
            fontSize: "14px", fontFamily: "'JetBrains Mono', monospace", showPrintMargin: false, wrap: true, useWorker: false,
            enableBasicAutocompletion: true, enableLiveAutocompletion: true, behavioursEnabled: true, autoScrollEditorIntoView: true
        });

        let files = {}; let currentFileName = null; const tabBar = document.getElementById("tab-bar");

        function saveWorkspace() {
            const dataToSave = {};
            for (let name in files) dataToSave[name] = files[name].session.getValue();
            localStorage.setItem("pyMobileIDE_files", JSON.stringify(dataToSave));
            localStorage.setItem("pyMobileIDE_active", currentFileName);
        }

        function createFile(name, initialCode, switchImmediately = true) {
            if (!name.endsWith(".py")) name += ".py";
            if (files[name]) return alert("File already exists!");
            const session = ace.createEditSession(initialCode, "ace/mode/python");
            session.on('change', () => { clearTimeout(session.saveTimeout); session.saveTimeout = setTimeout(saveWorkspace, 1000); });
            files[name] = { session: session };
            renderTabs();
            if (switchImmediately) switchFile(name);
            saveWorkspace();
        }

        function promptNewFile() {
            let name = prompt("Enter file name (e.g., 'app'):");
            if (name && name.trim() !== "") createFile(name.trim(), "# New Python file\n");
        }

        function switchFile(name) {
            if (!files[name]) return; currentFileName = name;
            editor.setSession(files[name].session);
            renderTabs(); saveWorkspace();
        }

        function closeFile(name, event) {
            event.stopPropagation();
            if (Object.keys(files).length === 1) return alert("Cannot close the last file.");
            delete files[name];
            if (currentFileName === name) switchFile(Object.keys(files)[0]); else renderTabs();
            saveWorkspace();
        }

        function renderTabs() {
            const addBtn = document.getElementById("add-tab-btn");
            tabBar.innerHTML = ''; tabBar.appendChild(addBtn);
            for (let name in files) {
                const tab = document.createElement("div");
                tab.className = `tab ${name === currentFileName ? 'active' : ''}`;
                tab.innerHTML = `<i class="ph-fill ph-file-code" style="color: #58a6ff;"></i> <span onclick="switchFile('${name}')">${name}</span> <span class="close-tab" onclick="closeFile('${name}', event)"><i class="ph ph-x"></i></span>`;
                tabBar.appendChild(tab);
            }
        }

        function initWorkspace() {
            const savedFiles = localStorage.getItem("pyMobileIDE_files");
            const activeFile = localStorage.getItem("pyMobileIDE_active");
            if (savedFiles) {
                const parsed = JSON.parse(savedFiles);
                for (let name in parsed) createFile(name, parsed[name], false);
                switchFile(activeFile && parsed[activeFile] ? activeFile : Object.keys(parsed)[0]);
            } else createFile("default.py", 'print("Hello, World!")\n');
        }
        initWorkspace();

        // --- 2. I/O: DOWNLOAD & UPLOAD ---
        function downloadCurrentFile() {
            if (!currentFileName) return;
            const a = document.createElement("a");
            a.href = URL.createObjectURL(new Blob([editor.getValue()], { type: "text/plain" }));
            a.download = currentFileName; a.click();
        }
        const fileUploadInput = document.getElementById("file-upload");
        function uploadFile() { fileUploadInput.click(); }
        fileUploadInput.addEventListener("change", (e) => {
            const file = e.target.files[0]; if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                let name = file.name; if (!name.endsWith(".py")) name += ".py";
                if (files[name]) name = "uploaded_" + name;
                createFile(name, ev.target.result);
            };
            reader.readAsText(file); fileUploadInput.value = "";
        });

        // --- 3. TERMINAL & PYTHON CORE ---
        const consoleDiv = document.getElementById("console");
        const runBtn = document.getElementById("run-btn");
        let pyodide;

        function clearConsole() { consoleDiv.innerHTML = ""; }
        function writeToConsole(text, type = "normal") {
            const span = document.createElement("span");
            span.className = type === "error" ? "error-text" : type === "sys" ? "sys-text" : type === "hint" ? "hint-text" : type === "scan" ? "scan-text" : "";
            span.innerHTML = text + "\n";
            consoleDiv.appendChild(span);
            consoleDiv.scrollTop = consoleDiv.scrollHeight;
        }

        function analyzeError(errString) {
            const coreError = errString.trim().split("\n").pop();
            writeToConsole(`❌ Error: ${coreError}`, "error");
            if (coreError.includes("SyntaxError")) writeToConsole("💡 Fix: Check for missing quotes, colons (:), or unmatched parentheses ().", "hint");
            else if (coreError.includes("NameError")) writeToConsole("💡 Fix: A variable or function wasn't defined before you used it. Check your spelling.", "hint");
            else if (coreError.includes("TypeError")) writeToConsole("💡 Fix: You are mixing incompatible data types.", "hint");
        }

        async function initPython() {
            try {
                pyodide = await loadPyodide({ stdout: (t) => writeToConsole(t), stderr: (t) => writeToConsole(t, "error") });
                await pyodide.runPythonAsync(`
import builtins
from js import prompt
def web_input(prompt_text=""):
    user_response = prompt(prompt_text)
    if user_response is None: user_response = ""
    print(str(prompt_text) + str(user_response))
    return user_response
builtins.input = web_input
                `);
                runBtn.disabled = false; runBtn.innerHTML = '<i class="ph-fill ph-play"></i> Run';
                writeToConsole("[System] ✅ Python 3.11 Environment Ready! (Available Offline)", "sys");
            } catch (err) { writeToConsole("[System] Failed to load Python: " + err, "error"); }
        }

        // --- 4. OCR SCANNER ---
        const scanBtn = document.getElementById("scan-btn");
        const cameraInput = document.getElementById("camera-input");
        scanBtn.addEventListener("click", () => cameraInput.click());
        cameraInput.addEventListener("change", async (e) => {
            const file = e.target.files[0]; if (!file) return;
            writeToConsole("\n[Scanner] Initializing AI model...", "scan");
            scanBtn.disabled = true; scanBtn.innerHTML = '<i class="ph ph-spinner-gap ph-spin"></i> Scanning';
            try {
                const worker = await Tesseract.createWorker('eng');
                const ret = await worker.recognize(file);
                await worker.terminate();
                if (ret.data.text.trim() === "") writeToConsole("[Scanner] No text detected.", "error");
                else {
                    writeToConsole("[Scanner] Success! Code pasted.", "scan");
                    editor.session.insert(editor.getCursorPosition(), "\n# --- Scanned Code ---\n" + ret.data.text + "\n");
                }
            } catch (err) { writeToConsole("[Scanner] Error: " + err.message, "error"); } 
            finally { scanBtn.disabled = false; scanBtn.innerHTML = '<i class="ph ph-camera"></i> Scan'; cameraInput.value = ""; }
        });

        // --- 5. RUN EXECUTION ---
        runBtn.addEventListener("click", async () => {
            if (!pyodide) return;
            writeToConsole(`\n<span class="sys-text">root@mobile-ide:~# python ${currentFileName}</span>`);
            runBtn.disabled = true; runBtn.innerHTML = '<i class="ph ph-spinner-gap ph-spin"></i> Running';
            try { await pyodide.runPythonAsync(editor.getValue()); } 
            catch (err) { analyzeError(err.toString()); } 
            finally { runBtn.disabled = false; runBtn.innerHTML = '<i class="ph-fill ph-play"></i> Run'; }
        });

        initPython();
    </script>
</body>
</html>
